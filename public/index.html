<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordExplosion</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💣</text></svg>">
</head>
<body>

    <!-- Pantalla de Carga / Login -->
    <div id="login-screen" class="screen active">
        <div class="card">
            <h1>💣 WordExplosion</h1>
            <p>Juego de Palabras Explosivo</p>
            
            <div class="login-form">
                <input type="text" id="username-input" placeholder="Tu Nombre" maxlength="12">
                
                <div class="login-actions">
                    <!-- Crear Sala -->
                    <div class="action-group">
                        <button id="create-room-btn">Crear Nueva Sala</button>
                    </div>
                    
                    <div class="divider">O</div>

                    <!-- Unirse a Sala -->
                    <div class="action-group">
                        <input type="text" id="room-code-input" placeholder="Código (4 letras)" maxlength="4" style="text-transform: uppercase;">
                        <button id="join-room-btn" class="secondary-btn">Unirse a Sala</button>
                    </div>
                </div>
                <p id="login-error" class="error-msg"></p>
            </div>
        </div>
    </div>

    <!-- Sala de Espera -->
    <div id="waiting-screen" class="screen">
        <div class="card">
            <h2>Sala de Espera</h2>
            
            <div class="room-code-display">
                <span>CÓDIGO DE SALA:</span>
                <h1 id="display-room-code">----</h1>
            </div>

            <div id="players-list-waiting" class="players-grid"></div>
            <p id="waiting-status">Esperando jugadores...</p>
            
            <!-- Botón solo visible para el líder -->
            <button id="start-btn" class="hidden">Comenzar Partida</button>
        </div>
    </div>

    <!-- Pantalla de Juego -->
    <div id="game-screen" class="screen">
        <div class="game-container">
            
            <div class="bomb-container">
                <div class="bomb-graphic">💣</div>
                <div class="spark"></div>
                <!-- Temporizador Visual -->
                <div id="bomb-timer">--.--s</div>
            </div>
            
            <div class="syllable-display">
                <span class="label">CONTIENE:</span>
                <h1 id="current-syllable">...</h1>
            </div>

            <div class="input-area">
                <input type="text" id="word-input" placeholder="Escribe..." autocomplete="off" disabled>
                <div class="input-actions">
                    <button id="surrender-btn" class="danger-btn" disabled>Rendirse 🏳️</button>
                </div>
                <div id="feedback-msg"></div>
            </div>

        </div>

        <div class="footer-players">
            <div id="active-players-list" class="scrolling-wrapper"></div>
        </div>
    </div>

    <!-- Overlay de Game Over -->
    <div id="game-over-overlay" class="overlay hidden">
        <div class="overlay-content">
            <h1 id="winner-name">¡Ganador!</h1>
            <button id="back-to-lobby">Volver a la Sala</button>
        </div>
    </div>

    <!-- Créditos Footer -->
    <div class="credits-footer">Created by Meikers</div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
